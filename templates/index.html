<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Выбор мерча МГРИ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #d4e0fc 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 90px;
            padding-left: 190px;
            box-sizing: border-box;
        }

        .university-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(90deg, #0f53ad, #0b5394);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }

        .university-header img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 4px;

        }

        .university-header span {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .sidebar {
            position: fixed;
            top: 70px;
            left: 0;
            width: 180px;
            height: calc(100vh - 70px);
            background-color: #0b5394;
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            gap: 12px;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.08);
            z-index: 900;
            box-sizing: border-box;
        }

        .btn-sidebar {
            background: transparent;
            color: white;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: left;
            transition: all 0.2s ease;
            display: block;
            box-sizing: border-box;
        }

        .btn-sidebar:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(3px);
        }

        .admin-link {
            margin-top: auto;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
            padding: 5px 0;
            transition: color 0.2s;
        }

        .admin-link:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        h1 {
            color: #2c3e50;
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 22px;
            text-align: center;
            padding: 0 10px;
            font-weight: 600;
        }

        .card-container {
            position: relative;
            width: 360px;
            height: 480px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .card img {
            width: 100%;
            height: 310px;
            object-fit: contain;
            background-color: #fafafa;
        }

        .card-content {
            padding: 18px;
            text-align: left;
        }

        .card-content h3 {
            margin: 0 0 6px 0;
            color: #222;
            font-size: 18px;
        }

        .card-content p {
            margin: 0;
            color: #666;
            font-size: 13px;
            line-height: 1.4;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            z-index: 500;
        }

        button.action-btn {
            padding: 12px 38px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 16px rgba(11, 83, 148, 0.25);
            background: linear-gradient(135deg, #0b5394, #0f53ad);
            color: white;
            transition: all 0.2s ease;
        }

        button.action-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 22px rgba(11, 83, 148, 0.35);
        }

        button.action-btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 768px) {
            body {
                padding-left: 0;
                padding-top: 140px;
            }

            .sidebar {
                position: fixed;
                top: 70px;
                left: 0;
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-around;
                padding: 8px 10px;
                gap: 5px;
            }

            .btn-sidebar {
                font-size: 12px;
                padding: 6px 10px;
                text-align: center;
            }

            .admin-link {
                display: none;
            }

            .card-container {
                width: 90vw;
                max-width: 340px;
                height: 460px;
            }
        }
    </style>
</head>

<body>

    <div class="university-header">
        <img src="/static/images/Logotip.jpg" alt="Логотип">
        <span>Выбираем мерч университета вместе</span>
    </div>

    <div class="sidebar">
        <a id="fav-link" href="#" class="btn-sidebar">Избранное</a>
        <button class="btn-sidebar" onclick="resetTest()">Пройти заново</button>
        <a href="/stats" class="admin-link">Статистика (админ)</a>
    </div>

    <h1>Выберите что вам нравится из предоставленных вариантов</h1>

    <div class="card-container">
        {% for item in items %}
        <div class="card" id="card-{{ loop.index0 }}" data-id="{{ item.id }}"
            style="z-index: {{ items|length - loop.index0 }}">
            <img src="{{ item.image }}" alt="{{ item.title }}">
            <div class="card-content">
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="buttons" id="action-buttons">
        <button class="action-btn" onclick="swipe('left')">Дизлайк</button>
        <button class="action-btn" onclick="swipe('right')">Лайк</button>
    </div>

    <script>
        let clientId = localStorage.getItem('merch_client_id');
        if (!clientId) {
            clientId = 'user_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem('merch_client_id', clientId);
        }

        document.getElementById('fav-link').href = '/favorites?client_id=' + clientId;

        const totalItems = {{ items| length }};
        let currentIndex = parseInt(localStorage.getItem('merch_index')) || 0;

        window.addEventListener('DOMContentLoaded', () => {
            for (let i = 0; i < currentIndex; i++) {
                const card = document.getElementById('card-' + i);
                if (card) {
                    card.style.display = 'none';
                }
            }
            checkFinish();
        });

        function swipe(direction) {
            if (currentIndex < totalItems) {
                const card = document.getElementById('card-' + currentIndex);
                if (card) {
                    card.style.transform = direction === 'right' ? 'translateX(350px) rotate(20deg)' : 'translateX(-350px) rotate(-20deg)';
                    card.style.opacity = '0';

                    if (direction === 'right') {
                        const merchId = card.getAttribute('data-id');
                        fetch('/favorite/' + merchId, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'client_id=' + clientId
                        });
                    }
                }
                currentIndex++;
                localStorage.setItem('merch_index', currentIndex);

                checkFinish();
            }
        }

        function checkFinish() {
            if (currentIndex >= totalItems) {
                document.querySelector('.card-container').innerHTML = '<h3 style="text-align: center; margin-top:160px; color:#444;">Вы оценили весь мерч!</h3>';
                document.getElementById('action-buttons').style.display = 'none';
            }
        }

        function resetTest() {
            fetch('/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'client_id=' + clientId
            }).then(() => {
                localStorage.removeItem('merch_index');
                location.reload();
            });
        }
    </script>

</body>

</html>
